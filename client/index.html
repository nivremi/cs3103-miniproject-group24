<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveRecall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">LR</span>
      <span>LiveRecall</span>
      <span class="session" id="session-label">Session L1</span>
    </div>
    <div id="conn" class="pill" data-state="connecting" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="conn-text">Connecting…</span>
    </div>
  </header>

  <main class="stage">
    <section id="live" class="live" aria-label="Live captions" aria-live="polite">
      <p class="empty" id="empty">Waiting for the lecturer… captions will appear here.</p>
    </section>
    <button id="jump" class="jump" hidden>Jump to live ↓</button>
  </main>

  <footer class="controls">
    <button id="miss" class="primary" aria-haspopup="dialog" aria-controls="recall">
      What did I miss? <kbd>M</kbd>
    </button>
    <div class="legend" aria-hidden="true">
      <span class="chip prov">speaking…</span>
      <span class="chip final">final</span>
    </div>
  </footer>

  <aside id="recall" class="recall" role="dialog" aria-modal="false" aria-labelledby="recall-title" hidden>
    <div class="recall-head">
      <h2 id="recall-title">What did I miss?</h2>
      <button id="recall-close" class="icon" aria-label="Close">✕</button>
    </div>
    <div class="seg" role="tablist" aria-label="Recall window">
      <button role="tab" data-seconds="15" aria-selected="false">15 s</button>
      <button role="tab" data-seconds="30" aria-selected="true">30 s</button>
      <button role="tab" data-seconds="60" aria-selected="false">60 s</button>
    </div>
    <p class="recall-meta" id="recall-meta"></p>
    <ol class="recall-list" id="recall-list"></ol>
    <button id="recall-refresh" class="ghost" hidden>Show newer captions</button>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="caption_store.js"></script>
  <script src="app.js"></script>
</body>
</html>
